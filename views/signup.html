<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up for MUNify</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/signup.css">
</head>
<body>

  <!-- ==========================================================================
       Header & Navbar
       ========================================================================== -->
  <header>
    <nav class="navbar" id="mainNavbar">
      <div class="navbar-container">
        <!-- Brand Logo -->
        <div class="navbar-brand">
          <a href="user/index.html" class="navbar-logo" id="brandLogo">MUNify</a>
        </div>

        <!-- Mobile Navigation Toggle -->
        <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle Navigation Menu" aria-expanded="false">
          ☰
        </button>

        <!-- Center Navigation Links -->
        <ul class="navbar-nav" id="navbarLinks">
          <li><a href="user/index.html" class="nav-link" id="navOverview">Overview</a></li>
          <li><a href="user/about.html" class="nav-link" id="navAbout">About</a></li>
          <li><a href="user/contact.html" class="nav-link" id="navContact">Contact Us</a></li>
        </ul>

        <!-- Right Action Buttons -->
        <div class="navbar-actions">
          <a href="user/login.html" class="btn-yellow" id="btnLogin">Login</a>
          <a href="user/signup.html" class="btn-yellow" id="btnSignup">Signup</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- ==========================================================================
       Main Content: Signup Card
       ========================================================================== -->
  <main class="signup-page">
    <div class="signup-card" id="signupCard">
      <h1 class="signup-card-title" id="signupHeading">Sign Up for MUNify</h1>

      <form class="signup-form" id="signupForm" novalidate>
        <!-- Full Name Field -->
        <div class="form-group">
          <label for="signupName" class="form-label" id="labelName">Full Name</label>
          <input 
            type="text" 
            id="signupName" 
            name="name" 
            class="form-input" 
            placeholder="Enter your full name" 
            required
            autocomplete="name"
          >
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="signupEmail" class="form-label" id="labelEmail">Email</label>
          <input 
            type="email" 
            id="signupEmail" 
            name="email" 
            class="form-input" 
            placeholder="Enter your email" 
            required
            autocomplete="email"
          >
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="signupPassword" class="form-label" id="labelPassword">Password</label>
          <input 
            type="password" 
            id="signupPassword" 
            name="password" 
            class="form-input" 
            placeholder="Create a password" 
            required
            autocomplete="new-password"
          >
        </div>

        <!-- Account Type Field -->
        <div class="form-group">
          <label for="signupAccountType" class="form-label" id="labelAccountType">Account Type</label>
          <select id="signupAccountType" name="accountType" class="form-select" required>
            <option value="" disabled selected hidden>Choose Account Type</option>
            <option value="delegate">Delegate</option>
            <option value="chair">Committee Chair</option>
            <option value="organiser">Executive Board / Organiser</option>
          </select>
        </div>

        <!-- Status Message Container -->
        <div class="form-status-message" id="formStatusMessage" role="alert"></div>

        <!-- Submit Button -->
        <button type="submit" class="btn-signup-submit" id="btnSubmitSignup">
          Sign Up
        </button>

        <!-- Login Link -->
        <p class="login-prompt" id="loginPrompt">
          Already have an account? <a href="user/login.html" class="login-link" id="linkLogin">Login</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/signup.js"></script>
</body>
</html>
